[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mention-info"
version = "0.1.0"
description = "Notify Slack about recent supply-chain attacks found by a Codex scheduled research task"
requires-python = ">=3.10"
dependencies = ["sounddevice>=0.5,<1"]

[project.scripts]
mention-info-notify = "mention_info.cli:main"
mention-info-screen-cup-handle = "mention_info.cup_handle:main"

[tool.setuptools.packages.find]
where = ["src"]
